name: Build OpenCentauri Image

on:
  workflow_call:
    inputs:
      use_cache:
        type: boolean
        default: true
      write_back_cache:
        type: boolean
        default: false
      upload_all_artifacts:
        type: boolean
        default: false
      ota_bundles:
        type: boolean
        default: true
      version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache'
        type: boolean
        default: true
      write_back_cache:
        description: 'Write back cache'
        type: boolean
        default: false
      upload_all_artifacts:
        description: 'Upload all artifacts'
        type: boolean
        default: false
      ota_bundles:
        description: 'Build and upload Elegoo OTA bundles'
        type: boolean
        default: true
      version:
        description: 'Override distro version'
        type: string
        default: ''

env:
  # Sims server cache dir
  CACHE_DIR: /data/cache

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore cache
        if: ${{ inputs.use_cache }}
        run: |
          mkdir -p ./build
          if [ -d "$CACHE_DIR" ] && [ -n "$(find "$CACHE_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            cp -a "$CACHE_DIR"/. ./build/
          else
            echo "No Yocto cache found at $CACHE_DIR; continuing with a clean build."
          fi

      - name: Set distro version
        if: ${{ inputs.version != '' }}
        run: |
          version="${{ inputs.version }}"
          version="${version:0:10}"
          sed -i -E "s/^DISTRO_VERSION = \".*\"/DISTRO_VERSION = \"${version}\"/" meta-opencentauri/conf/distro/cosmos.conf

      - name: Disable Elegoo OTA bundles
        if: ${{ !inputs.ota_bundles }}
        run: |
          TEMPLATECONF="$PWD/meta-opencentauri/conf/templates/opencentauri" source openembedded-core/oe-init-build-env build
          # Removing this format also disables the do_elegoo_ota task.
          printf '\nIMAGE_FSTYPES:remove = "zip.sig"\n' >> conf/local.conf

      - name: Build CC1 image
        run: |
          TEMPLATECONF="$PWD/meta-opencentauri/conf/templates/opencentauri" source openembedded-core/oe-init-build-env build
          MACHINE=centauri-carbon-1 bitbake cosmos

      - name: Build CC2 image
        run: |
          TEMPLATECONF="$PWD/meta-opencentauri/conf/templates/opencentauri" source openembedded-core/oe-init-build-env build
          MACHINE=centauri-carbon-2 bitbake cosmos

      - name: Upload build artifacts CC1 (SWU only)
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1 Firmware
          path: build/tmp/deploy/images/centauri-carbon-1/cosmos-centauri-carbon-1.swu

      - name: Upload build artifacts CC2 (Elegoo OTA bundles)
        if: ${{ inputs.ota_bundles }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-2 Elegoo OTA
          path: |
            build/tmp/deploy/images/centauri-carbon-2/cc2_eeb001_*.zip.sig
            build/tmp/deploy/images/centauri-carbon-2/c2_eeb001_*.zip.sig
          if-no-files-found: error

      - name: Upload build artifacts CC1
        if: ${{ inputs.upload_all_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-images
          path: build/tmp/deploy/images/centauri-carbon-1/

      - name: Upload build artifacts CC2
        if: ${{ inputs.upload_all_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-2-images
          path: build/tmp/deploy/images/centauri-carbon-2/

      - name: Write back cache
        if: ${{ inputs.write_back_cache }}
        run: |
          mkdir -p "$CACHE_DIR"
          if [ -d ./build/downloads ]; then
            cp -a ./build/downloads "$CACHE_DIR"/
          fi
          if [ -d ./build/sstate-cache ]; then
            cp -a ./build/sstate-cache "$CACHE_DIR"/
          fi

      - name: Clean workspace
        if: always()
        run: git clean -ffdx
