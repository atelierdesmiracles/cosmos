name: Build OpenCentauri Image (on push main)
on:
  push:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      use_cache: true
      write_back_cache: true
      upload_all_artifacts: false
      ota_bundles: true
      version: ${{ github.sha }}

  publish-nightly:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-nightly
      queue: max
    permissions:
      contents: write
    steps:
      - name: Download CC1 Firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: centauri-carbon-1 Firmware
          path: ./firmware

      - name: Download CC2 Elegoo OTA artifacts
        uses: actions/download-artifact@v4
        with:
          name: centauri-carbon-2 Elegoo OTA
          path: ./firmware

      - name: Upload firmware to nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping nightly release: main is at $main_sha, but this build is $GITHUB_SHA"
            exit 0
          fi

          if ! gh release view 0.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create 0.0.0 \
              --target "$GITHUB_SHA" \
              --title "COSMOS Nightly" \
              --notes "Automated nightly firmware build for commit $GITHUB_SHA." \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi

          shopt -s nullglob
          ota_files=(./firmware/*.zip.sig)
          if (( ${#ota_files[@]} == 0 )); then
            echo "No CC2 Elegoo OTA .zip.sig artifact was downloaded."
            exit 1
          fi

          gh release upload 0.0.0 \
            "./firmware/cosmos-centauri-carbon-1.swu" \
            "${ota_files[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/0.0.0" \
            -f sha="$GITHUB_SHA" -F force=true
